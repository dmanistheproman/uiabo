<text x="64" y="128" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="white" text-anchor="start">From message to evidence</text>
<text x="64" y="167" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#C6DBE5" text-anchor="start">How UIABO checks a short text claim and explains what the evidence supports.</text>
