<text x="692" y="364" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#15374A" text-anchor="start">Find</text>
<text x="692" y="397" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#15374A" text-anchor="start">sources</text>
<text x="692" y="442" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">Look for published fact</text>
<text x="692" y="469" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">checks and official</text>
<text x="692" y="496" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">sources.</text>
<text x="692" y="523" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">Broaden weak searches.</text>
