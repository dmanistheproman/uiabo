<text x="996" y="364" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#15374A" text-anchor="start">Read &amp;</text>
<text x="996" y="397" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#15374A" text-anchor="start">filter evidence</text>
<text x="996" y="442" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">Read the original pages.</text>
<text x="996" y="469" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">Check source eligibility,</text>
<text x="996" y="496" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">relevance and policy</text>
<text x="996" y="523" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">scope.</text>
