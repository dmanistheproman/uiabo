<text x="84" y="442" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">Paste English text.</text>
<text x="84" y="469" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">Check account and</text>
<text x="84" y="496" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">allowance.</text>
<text x="84" y="523" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">Validate and normalise</text>
<text x="84" y="550" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#15374A" text-anchor="start">the input.</text>
