<text x="84" y="966" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#82DDD5" text-anchor="start">NON-FACTUAL TEXT</text>
<text x="84" y="993" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="white" text-anchor="start">Return a saved explanation; skip evidence search.</text>
